<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMAC-1 Test Case 3</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            max-width: 1400px;
            margin: 20px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        h1, h2, h3 {
            color: #4ec9b0;
        }
        .output {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 15px;
            margin: 10px 0;
            white-space: pre-wrap;
            font-size: 13px;
            line-height: 1.6;
        }
        .phase {
            margin: 20px 0;
            padding: 15px;
            background: #2d2d30;
            border-left: 4px solid #4ec9b0;
        }
        .state {
            margin: 10px 0;
            padding: 10px;
            background: #1e1e1e;
            border-radius: 4px;
        }
        .register {
            color: #ce9178;
        }
        .value {
            color: #b5cea8;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 10px 0;
        }
        button:hover {
            background: #1177bb;
        }
        .label {
            color: #9cdcfe;
            font-weight: bold;
        }
        .hex-break {
            word-break: break-all;
        }
    </style>
</head>
<body>
    <h1>SMAC-1 Implementation - Test Case 3</h1>
    <button onclick="runSMAC1()">Run SMAC-1 Test Case 3</button>
    <div id="output"></div>

    <script>
        // AES S-box
        const sbox = [
            0x63, 0x7C, 0x77, 0x7B, 0xF2, 0x6B, 0x6F, 0xC5, 0x30, 0x01, 0x67, 0x2B, 0xFE, 0xD7, 0xAB, 0x76,
            0xCA, 0x82, 0xC9, 0x7D, 0xFA, 0x59, 0x47, 0xF0, 0xAD, 0xD4, 0xA2, 0xAF, 0x9C, 0xA4, 0x72, 0xC0,
            0xB7, 0xFD, 0x93, 0x26, 0x36, 0x3F, 0xF7, 0xCC, 0x34, 0xA5, 0xE5, 0xF1, 0x71, 0xD8, 0x31, 0x15,
            0x04, 0xC7, 0x23, 0xC3, 0x18, 0x96, 0x05, 0x9A, 0x07, 0x12, 0x80, 0xE2, 0xEB, 0x27, 0xB2, 0x75,
            0x09, 0x83, 0x2C, 0x1A, 0x1B, 0x6E, 0x5A, 0xA0, 0x52, 0x3B, 0xD6, 0xB3, 0x29, 0xE3, 0x2F, 0x84,
            0x53, 0xD1, 0x00, 0xED, 0x20, 0xFC, 0xB1, 0x5B, 0x6A, 0xCB, 0xBE, 0x39, 0x4A, 0x4C, 0x58, 0xCF,
            0xD0, 0xEF, 0xAA, 0xFB, 0x43, 0x4D, 0x33, 0x85, 0x45, 0xF9, 0x02, 0x7F, 0x50, 0x3C, 0x9F, 0xA8,
            0x51, 0xA3, 0x40, 0x8F, 0x92, 0x9D, 0x38, 0xF5, 0xBC, 0xB6, 0xDA, 0x21, 0x10, 0xFF, 0xF3, 0xD2,
            0xCD, 0x0C, 0x13, 0xEC, 0x5F, 0x97, 0x44, 0x17, 0xC4, 0xA7, 0x7E, 0x3D, 0x64, 0x5D, 0x19, 0x73,
            0x60, 0x81, 0x4F, 0xDC, 0x22, 0x2A, 0x90, 0x88, 0x46, 0xEE, 0xB8, 0x14, 0xDE, 0x5E, 0x0B, 0xDB,
            0xE0, 0x32, 0x3A, 0x0A, 0x49, 0x06, 0x24, 0x5C, 0xC2, 0xD3, 0xAC, 0x62, 0x91, 0x95, 0xE4, 0x79,
            0xE7, 0xC8, 0x37, 0x6D, 0x8D, 0xD5, 0x4E, 0xA9, 0x6C, 0x56, 0xF4, 0xEA, 0x65, 0x7A, 0xAE, 0x08,
            0xBA, 0x78, 0x25, 0x2E, 0x1C, 0xA6, 0xB4, 0xC6, 0xE8, 0xDD, 0x74, 0x1F, 0x4B, 0xBD, 0x8B, 0x8A,
            0x70, 0x3E, 0xB5, 0x66, 0x48, 0x03, 0xF6, 0x0E, 0x61, 0x35, 0x57, 0xB9, 0x86, 0xC1, 0x1D, 0x9E,
            0xE1, 0xF8, 0x98, 0x11, 0x69, 0xD9, 0x8E, 0x94, 0x9B, 0x1E, 0x87, 0xE9, 0xCE, 0x55, 0x28, 0xDF,
            0x8C, 0xA1, 0x89, 0x0D, 0xBF, 0xE6, 0x42, 0x68, 0x41, 0x99, 0x2D, 0x0F, 0xB0, 0x54, 0xBB, 0x16
        ];

        // SMAC-1 permutation σ1
        const sigma1 = [0, 7, 14, 11, 4, 13, 10, 1, 8, 15, 6, 3, 12, 5, 2, 9];

        let outputDiv;

        function log(msg) {
            outputDiv.innerHTML += msg + '\n';
        }

        function toHex(arr) {
            return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function printState(label, A1, A2, A3) {
            log(`<span class="label">${label}:</span>`);
            log(`  <span class="register">A1:</span> <span class="value hex-break">${toHex(A1)}</span>`);
            log(`  <span class="register">A2:</span> <span class="value hex-break">${toHex(A2)}</span>`);
            log(`  <span class="register">A3:</span> <span class="value hex-break">${toHex(A3)}</span>`);
        }

        function gmul(a, b) {
            let p = 0;
            for (let i = 0; i < 8; i++) {
                if (b & 1) p ^= a;
                let hi = a & 0x80;
                a = (a << 1) & 0xFF;
                if (hi) a ^= 0x1b;
                b >>= 1;
            }
            return p;
        }

        function subBytes(state) {
            return state.map(b => sbox[b]);
        }

        function shiftRows(state) {
            const temp = new Uint8Array(16);
            temp[0] = state[0]; temp[1] = state[5]; temp[2] = state[10]; temp[3] = state[15];
            temp[4] = state[4]; temp[5] = state[9]; temp[6] = state[14]; temp[7] = state[3];
            temp[8] = state[8]; temp[9] = state[13]; temp[10] = state[2]; temp[11] = state[7];
            temp[12] = state[12]; temp[13] = state[1]; temp[14] = state[6]; temp[15] = state[11];
            return temp;
        }

        function mixColumns(state) {
            const temp = new Uint8Array(16);
            for (let c = 0; c < 4; c++) {
                const s0 = state[c*4], s1 = state[c*4+1], s2 = state[c*4+2], s3 = state[c*4+3];
                temp[c*4] = gmul(0x02, s0) ^ gmul(0x03, s1) ^ s2 ^ s3;
                temp[c*4+1] = s0 ^ gmul(0x02, s1) ^ gmul(0x03, s2) ^ s3;
                temp[c*4+2] = s0 ^ s1 ^ gmul(0x02, s2) ^ gmul(0x03, s3);
                temp[c*4+3] = gmul(0x03, s0) ^ s1 ^ s2 ^ gmul(0x02, s3);
            }
            return temp;
        }

        function AESR(X, K) {
            let out = new Uint8Array(X);
            out = subBytes(out);
            out = shiftRows(out);
            out = mixColumns(out);
            for (let i = 0; i < 16; i++) {
                out[i] ^= K[i];
            }
            return out;
        }

        function applySigma(inp) {
            const out = new Uint8Array(16);
            for (let i = 0; i < 16; i++) {
                out[i] = inp[sigma1[i]];
            }
            return out;
        }

        function Pi(A1, A2, A3, M) {
            const temp = new Uint8Array(16);
            for (let i = 0; i < 16; i++) {
                temp[i] = A2[i] ^ A3[i] ^ M[i];
            }
            const A1_new = applySigma(temp);
            const A2_new = AESR(A1, M);
            const A3_new = AESR(A2, M);
            return [A1_new, A2_new, A3_new];
        }

        function Pi_verbose(A1, A2, A3, M, label) {
            log(`<span class="label">${label}</span>`);
            log(`  Input A1: <span class="value">${toHex(A1)}</span>`);
            log(`  Input A2: <span class="value">${toHex(A2)}</span>`);
            log(`  Input A3: <span class="value">${toHex(A3)}</span>`);
            log(`  Input M:  <span class="value">${toHex(M)}</span>`);
            
            const [A1_new, A2_new, A3_new] = Pi(A1, A2, A3, M);
            
            log(`  Output A1: <span class="value">${toHex(A1_new)}</span>`);
            log(`  Output A2: <span class="value">${toHex(A2_new)}</span>`);
            log(`  Output A3: <span class="value">${toHex(A3_new)}</span>`);
            log('');
            
            return [A1_new, A2_new, A3_new];
        }

        function InitFinal(A1, A2, A3, showRounds = false) {
            const X1 = new Uint8Array(A1);
            const X2 = new Uint8Array(A2);
            const X3 = new Uint8Array(A3);
            
            const one_star = new Uint8Array(16);
            one_star[0] = 1;
            
            for (let d = 0; d < 9; d++) {
                if (showRounds) {
                    [A1, A2, A3] = Pi_verbose(A1, A2, A3, one_star, `Round ${d + 1}:`);
                } else {
                    [A1, A2, A3] = Pi(A1, A2, A3, one_star);
                }
            }
            
            // PRP-PRF switch
            for (let i = 0; i < 16; i++) {
                A1[i] ^= X1[i];
                A2[i] ^= X2[i];
                A3[i] ^= X3[i];
            }
            
            return [A1, A2, A3];
        }

        function SMAC1(K, IV, A, C) {
            const K0 = K.slice(0, 16);
            const K1 = K.slice(16, 32);
            
            let A1 = new Uint8Array(K1);
            let A2 = new Uint8Array(K0);
            let A3 = new Uint8Array(IV);
            
            log('\n<div class="phase">');
            log('<h3>=== INITIALIZATION PHASE ===</h3>');
            printState('Initial state (K1→A1, K0→A2, IV→A3)', A1, A2, A3);
            log('');
            log('<span class="label">Running 9 rounds of Π with 1*:</span>');
            [A1, A2, A3] = InitFinal(A1, A2, A3, true);
            log('');
            printState('After InitFinal (9 rounds with 1*, then XOR with initial state)', A1, A2, A3);
            log('</div>');
            
            log('\n<div class="phase">');
            log('<h3>=== COMPRESSION PHASE ===</h3>');
            
            let block_idx = 0;
            
            // Process AD
            if (A && A.length > 0) {
                for (let i = 0; i < A.length; i += 16) {
                    const M = new Uint8Array(16);
                    const len = Math.min(16, A.length - i);
                    M.set(A.slice(i, i + len));
                    
                    [A1, A2, A3] = Pi_verbose(A1, A2, A3, M, `Block ${block_idx} (AD):`);
                    block_idx++;
                }
            }
            
            // Process Ciphertext
            if (C && C.length > 0) {
                for (let i = 0; i < C.length; i += 16) {
                    const M = new Uint8Array(16);
                    const len = Math.min(16, C.length - i);
                    M.set(C.slice(i, i + len));
                    
                    [A1, A2, A3] = Pi_verbose(A1, A2, A3, M, `Block ${block_idx} (CT):`);
                    block_idx++;
                }
            }
            
            // Length block (little-endian)
            const M = new Uint8Array(16);
            const len_A = BigInt((A ? A.length : 0) * 8);
            const len_C = BigInt((C ? C.length : 0) * 8);
            
            for (let i = 0; i < 8; i++) {
                M[i] = Number((len_A >> BigInt(i * 8)) & 0xFFn);
                M[8 + i] = Number((len_C >> BigInt(i * 8)) & 0xFFn);
            }
            
            [A1, A2, A3] = Pi_verbose(A1, A2, A3, M, `Block ${block_idx} (Length):`);
            printState('State after compression phase', A1, A2, A3);
            log('</div>');
            
            log('\n<div class="phase">');
            log('<h3>=== FINALIZATION PHASE ===</h3>');
            log('<span class="label">Running 9 rounds of Π with 1*:</span>');
            [A1, A2, A3] = InitFinal(A1, A2, A3, true);
            log('');
            printState('Final state (after 9 rounds with 1*, then XOR with pre-final state)', A1, A2, A3);
            log('</div>');
            
            return A2; // Tag extracted from A2
        }

        function runSMAC1() {
            outputDiv = document.getElementById('output');
            outputDiv.innerHTML = '<div class="output">';
            
            // Test case 3 from the paper (Appendix G)
            const K = new Uint8Array([
                0xb0, 0xb1, 0xb2, 0xb3, 0xb4, 0xb5, 0xb6, 0xb7,
                0xb8, 0xb9, 0xba, 0xbb, 0xbc, 0xbd, 0xbe, 0xbf,
                0xc0, 0xc1, 0xc2, 0xc3, 0xc4, 0xc5, 0xc6, 0xc7,
                0xc8, 0xc9, 0xca, 0xcb, 0xcc, 0xcd, 0xce, 0xcf
            ]);
            
            const IV = new Uint8Array([
                0xd0, 0xd1, 0xd2, 0xd3, 0xd4, 0xd5, 0xd6, 0xd7,
                0xd8, 0xd9, 0xda, 0xdb, 0xdc, 0xdd, 0xde, 0xdf
            ]);
            
            const A = new Uint8Array([
                0xe0, 0xe1, 0xe2, 0xe3, 0xe4, 0xe5, 0xe6, 0xe7,
                0xe8, 0xe9, 0xea, 0xeb, 0xec, 0xdd, 0xde, 0xef
            ]);
            
            const C = new Uint8Array([
                0xf0, 0xf1, 0xf2, 0xf3, 0xf4, 0xf5, 0xf6, 0xf7,
                0xf8, 0xf9, 0xfa, 0xfb, 0xfc, 0xfd, 0xfe, 0xff
            ]);
            
            log('<h2>=== SMAC-1 Test Case 3 ===</h2>');
            log(`<span class="label">Key (256 bits):</span> <span class="value hex-break">${toHex(K)}</span>`);
            log(`<span class="label">IV (128 bits):</span> <span class="value hex-break">${toHex(IV)}</span>`);
            log(`<span class="label">Associated Data (128 bits):</span> <span class="value hex-break">${toHex(A)}</span>`);
            log(`<span class="label">Ciphertext (256 bits):</span> <span class="value hex-break">${toHex(C)}</span>`);
            
            const tag = SMAC1(K, IV, A, C);
            
            log('\n<div class="phase">');
            log('<h3>=== FINAL MAC TAG ===</h3>');
            log(`<span class="label">Tag (128 bits):</span> <span class="value hex-break">${toHex(tag)}</span>`);
            log('</div>');
            
            outputDiv.innerHTML += '</div>';
        }
    </script>
</body>
</html>
